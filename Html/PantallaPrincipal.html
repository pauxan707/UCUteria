<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ucuteria</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../Styles/PantallaPrincipal.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
</head>
<body>
    <header class="header">
        <div class="headerIcons">
            <button class="headerButton">
                <img class="headerButtonImage" src="../Images/menu_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            </button>
            <button class= "logo">
                <img class="logoImage"src="../Images/image.png" alt="logoUcu">
            </button>
            <button class="headerButton">
                <img class="headerButtonImage" src="../Images/shopping_cart_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            </button>
        </div>
    </header>
    <div class="buscadorContainer">
        <span class="material-symbols-outlined">search</span>
        <input class="buscador" placeholder="Buscar producto..."></input>
    </div>
    
    <div class="categorias">
        <h2 class="menu">Categorias</h2>
        <button class="todas">
            <span class="material-symbols-outlined">grid_view</span>
            Todas
        </button>
        <button class="cafe">
            <span class="material-symbols-outlined">coffee</span>
            Cafe
        </button>
        <button class="te">
            <span class="material-symbols-outlined">local_drink</span>
            Té
        </button>
        <button class="pasteleria">
            <span class="material-symbols-outlined">cake</span>
            Pastelería
        </button>
        <button class="sandwiches">
            <span class="material-symbols-outlined">lunch_dining</span>
            Sándwiches 
            
        </button>
    </div>

    <div class="selector">
        <h2 class="ordenar">Ordenar por</h2>
        <select name="opciones">
            <option value="Nombre(A-Z)">Nombre(A-Z)</option>
            <option value="Precio menor">Precio menor</option>
            <option value="Precio mayor">Precio mayor</option>
            <option value="Nombre(Z-A)">Nombre(Z-A)</option>
        </select>
    </div>

    <ul id="comidasLista"></ul> 
    
    <div class="carrito">
        
    </div>
    
</body>
<script src="script.js"></script>
</html>
